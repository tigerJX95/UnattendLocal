name: Build missing Release EXEs

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-exe-${{ github.event.release.id || github.ref }}
  cancel-in-progress: false

jobs:
  inspect:
    name: Check Release EXE attachments
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      build: ${{ steps.decision.outputs.build }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Decide whether EXEs are needed
        id: decision
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
            'build=true' >> $env:GITHUB_OUTPUT
            'Manual build: outputs stay in Actions; no Release is changed.' >> $env:GITHUB_STEP_SUMMARY
          } else {
            . ./Tools/ReleaseAssets.ps1
            $decision = Get-ReleaseBuildDecision -Repository $env:GITHUB_REPOSITORY -ReleaseId ([long]$env:RELEASE_ID) -Tag $env:RELEASE_TAG
            "build=$($decision.Build.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
            $decision.Reason >> $env:GITHUB_STEP_SUMMARY
          }

  build:
    name: Build and verify Windows x64 EXEs
    needs: inspect
    if: needs.inspect.outputs.build == 'true'
    runs-on: windows-2025
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      version: ${{ steps.outputs.outputs.version }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify tag matches project version and main history
        if: github.event_name == 'release'
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath Desktop/Desktop.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/InformationalVersion').InnerText.Trim()
          if ($env:RELEASE_TAG -cne "v$version") { throw "Tag $env:RELEASE_TAG does not match project version v$version" }
          & git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Could not fetch main branch.' }
          & git merge-base --is-ancestor HEAD refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release tag must point to a commit already on main.' }
      - name: Audit dependencies
        shell: pwsh
        run: |
          dotnet restore UnattendLocal.sln --force --disable-parallel -m:1 -nr:false -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Dependency security audit failed.' }
      - name: Verify source and regression tests
        shell: pwsh
        run: ./verify.ps1
      - name: Publish two single-file executables
        shell: pwsh
        run: ./publish.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'packages')
      - name: Validate EXE outputs
        id: outputs
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath Desktop/Desktop.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/InformationalVersion').InnerText.Trim()
          $root = Join-Path $env:RUNNER_TEMP 'packages'
          $expected = @("UnattendLocal_V${version}_x64_SelfContained.exe", "UnattendLocal_V${version}_x64_FrameworkDependent.exe")
          $actual = @(Get-ChildItem -LiteralPath $root -File | Select-Object -ExpandProperty Name)
          if (@(Compare-Object $expected $actual).Count -ne 0) { throw "Expected exactly two EXEs, got: $($actual -join ', ')" }
          foreach ($filename in $expected) {
            $item = Get-Item -LiteralPath (Join-Path $root $filename)
            if ($item.Length -le 0) { throw "Empty executable: $filename" }
            $hash = (Get-FileHash -LiteralPath $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "${hash}  $filename" >> $env:GITHUB_STEP_SUMMARY
          }
          "version=$version" >> $env:GITHUB_OUTPUT
      - name: Upload self-contained EXE without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/packages/UnattendLocal_V${{ steps.outputs.outputs.version }}_x64_SelfContained.exe
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Upload framework-dependent EXE without ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          path: ${{ runner.temp }}/packages/UnattendLocal_V${{ steps.outputs.outputs.version }}_x64_FrameworkDependent.exe
          archive: false
          if-no-files-found: error
          retention-days: 7
      - name: Attach generated EXEs to the published Release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ github.event.release.id }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          $ErrorActionPreference = 'Stop'
          . ./Tools/ReleaseAssets.ps1
          Publish-ReleaseExecutables -Repository $env:GITHUB_REPOSITORY -ReleaseId ([long]$env:RELEASE_ID) -Tag $env:RELEASE_TAG -PackageDirectory (Join-Path $env:RUNNER_TEMP 'packages')
