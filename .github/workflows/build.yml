name: Build EXE (manual)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and package Windows x64
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'
      - name: Audit dependencies before packaging
        shell: pwsh
        run: |
          dotnet restore UnattendLocal.sln --force --disable-parallel -m:1 -nr:false -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
          if ($LASTEXITCODE -ne 0) { throw 'Dependency security audit failed.' }
      - name: Verify source
        shell: pwsh
        run: ./verify.ps1
      - name: Build both EXE variants
        shell: pwsh
        run: ./publish.ps1 -OutputRoot (Join-Path $env:RUNNER_TEMP 'packages') -CreateZip
      - name: Package source and build information
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          [xml]$project = Get-Content -LiteralPath Desktop/Desktop.csproj -Raw
          $version = $project.SelectSingleNode('/Project/PropertyGroup/InformationalVersion').InnerText.Trim()
          if ($version -notmatch '^\d+\.\d+(?:\.\d+)?$') { throw 'Invalid release version.' }
          $output = Join-Path $env:RUNNER_TEMP 'packages'
          $source = Join-Path $output "UnattendLocal_V${version}_Source.zip"
          & git archive --format=zip "--prefix=UnattendLocal-source-v$version/" "--output=$source" HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Source packaging failed.' }
          $archives = @(Get-ChildItem -LiteralPath $output -Filter '*.zip' -File | Sort-Object Name)
          if ($archives.Count -ne 3) { throw 'Expected two program archives and one source archive.' }
          $commit = (& git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $commit -ne $env:GITHUB_SHA) { throw 'Source commit does not match the workflow commit.' }
          $sdk = (& dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'Cannot determine the build SDK version.' }
          $archiveInfo = @(foreach ($file in $archives) {
            [ordered]@{
              File = $file.Name
              Bytes = $file.Length
              SHA256 = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            }
          })
          $buildInfo = [ordered]@{
            Version = $version
            FileVersion = $project.SelectSingleNode('/Project/PropertyGroup/FileVersion').InnerText.Trim()
            SourceCommit = $commit
            SourceRef = $env:GITHUB_REF
            DotnetSdk = $sdk
            Target = 'win-x64'
            BuiltAtUtc = [DateTime]::UtcNow.ToString('o')
            RunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            RunAttempt = $env:GITHUB_RUN_ATTEMPT
            Archives = $archiveInfo
          }
          $metadata = Join-Path $output 'BUILD_INFO.json'
          $buildInfo | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath $metadata -Encoding utf8
          $checksums = foreach ($file in (@($archives) + @(Get-Item -LiteralPath $metadata))) {
            $hash = (Get-FileHash -LiteralPath $file.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $($file.Name)"
          }
          $checksums | Set-Content -LiteralPath (Join-Path $output 'SHA256SUMS.txt') -Encoding ascii
          "version=$version" >> $env:GITHUB_OUTPUT
          @(
            "## UnattendLocal V$version"
            ''
            "Commit: $commit"
            "SDK: $sdk"
            ''
            '| Archive | Bytes |'
            '| --- | ---: |'
            foreach ($item in $archiveInfo) { "| $($item.File) | $($item.Bytes) |" }
          ) >> $env:GITHUB_STEP_SUMMARY
      - name: Upload downloadable packages
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: UnattendLocal-V${{ steps.package.outputs.version }}-${{ github.run_number }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/packages/*.zip
            ${{ runner.temp }}/packages/SHA256SUMS.txt
            ${{ runner.temp }}/packages/BUILD_INFO.json
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
